<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="Showcash — products by Rajan Bhattarai">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b0d12"/>
      <stop offset="100%" stop-color="#141a2b"/>
    </linearGradient>
    <linearGradient id="txt" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7c6cff"/>
      <stop offset="50%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#f472b6"/>
    </linearGradient>
    <radialGradient id="glow1" cx="0.2" cy="0" r="0.8">
      <stop offset="0%" stop-color="#7c6cff" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#7c6cff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="0.9" cy="1" r="0.8">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="300" fill="url(#bg)"/>
  <rect width="1200" height="300" fill="url(#glow1)"/>
  <rect width="1200" height="300" fill="url(#glow2)"/>

  <!-- floating orbs -->
  <circle cx="120" cy="70" r="5" fill="#7c6cff" opacity="0.8">
    <animate attributeName="cy" values="70;55;70" dur="4s" repeatCount="indefinite"/>
  </circle>
  <circle cx="1080" cy="220" r="7" fill="#38bdf8" opacity="0.7">
    <animate attributeName="cy" values="220;240;220" dur="5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="980" cy="80" r="4" fill="#f472b6" opacity="0.8">
    <animate attributeName="cy" values="80;95;80" dur="3.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="220" cy="230" r="6" fill="#34d399" opacity="0.6">
    <animate attributeName="cy" values="230;212;230" dur="4.5s" repeatCount="indefinite"/>
  </circle>

  <text x="600" y="150" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif"
        font-size="84" font-weight="800" letter-spacing="2" fill="url(#txt)">SHOWCASH</text>
  <text x="600" y="200" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif"
        font-size="24" fill="#9aa3b5">🚀 Products built by Rajan Bhattarai · @cdrrazan</text>

  <rect x="450" y="228" width="300" height="3" rx="1.5" fill="url(#txt)">
    <animate attributeName="width" values="0;300" dur="1.2s" fill="freeze"/>
    <animate attributeName="x" values="600;450" dur="1.2s" fill="freeze"/>
  </rect>
</svg>
