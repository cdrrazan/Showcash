<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="280" viewBox="0 0 1200 280" role="img" aria-label="Showcash — the product catalogue of Rajan Bhattarai">
  <defs>
    <radialGradient id="light" cx="0.5" cy="-0.2" r="1.1">
      <stop offset="0%" stop-color="#171614"/>
      <stop offset="100%" stop-color="#0b0b0c"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="280" fill="url(#light)"/>
  <rect x="0.5" y="0.5" width="1199" height="279" fill="none" stroke="#1e1e20"/>

  <text x="600" y="88" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif"
        font-size="13" letter-spacing="7" fill="#c8a978">INDEPENDENT PRODUCT STUDIO</text>

  <text x="600" y="172" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif"
        font-size="76" letter-spacing="14" fill="#ececea">SHOWCASH</text>

  <line x1="480" y1="205" x2="720" y2="205" stroke="#c8a978" stroke-width="1">
    <animate attributeName="x1" values="600;480" dur="1.4s" fill="freeze"/>
    <animate attributeName="x2" values="600;720" dur="1.4s" fill="freeze"/>
  </line>

  <text x="600" y="238" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif"
        font-style="italic" font-size="17" fill="#6f6f69">The product catalogue of Rajan Bhattarai · @cdrrazan</text>
</svg>
